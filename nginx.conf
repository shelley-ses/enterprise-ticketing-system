# =========================================================================
# 1. Main Production Entrypoint (Port 80)
# =========================================================================
server {
    listen 80;
    server_name localhost;

    # Admin/Employee Frontend
    location /ticketing {
        proxy_pass http://ticketing-web-real:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Customer Frontend
    location / {
        proxy_pass http://customer-ticketing-web-real:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (Laravel Reverb proxy)
    location /app/ {
        proxy_pass http://reverb:6001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastCGI proxying for API backend microservices
    location ~ ^/api/ticketing/customer(.*)$ {
        fastcgi_pass customer-service:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI /api$1;
    }

    location ~ ^/api/ticketing/ticket(.*)$ {
        fastcgi_pass ticket-service:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI /api$1;
    }

    location ~ ^/api/ticketing/notification(.*)$ {
        fastcgi_pass notification-service:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI /api$1;
    }

    location ~ ^/api/ticketing/analytics(.*)$ {
        fastcgi_pass analytics-service:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI /api$1;
    }

    location ~ ^/api/ticketing/ai(.*)$ {
        fastcgi_pass ai-service:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI /api$1;
    }
}

# =========================================================================
# 2. Virtual Hosts for 'capstone-auth-module' API Requests (Port 8000)
# =========================================================================

# Customer Service API (Translates HTTP to FastCGI)
server {
    listen 8000;
    server_name customer-service customer-service-prod;

    location / {
        fastcgi_pass customer-service:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }
}

# Ticket Service API (Translates HTTP to FastCGI)
server {
    listen 8000;
    server_name ticket-service ticket-service-prod;

    location / {
        fastcgi_pass ticket-service:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }
}

# =========================================================================
# 3. Virtual Hosts for 'capstone-auth-module' Frontend Requests
# =========================================================================

