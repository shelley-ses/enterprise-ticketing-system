services:

  db:
    image: mysql:8
    container_name: capstone-db
    restart: always
    command: --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7
    container_name: capstone-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  reverb:
    build:
      context: ./services/customer-service
    container_name: capstone-reverb
    volumes:
      - ./services/customer-service:/var/www
    restart: always
    environment:
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REDIS_HOST: redis
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 6001
    ports:
      - "6001:6001"
    command: >
      sh -lc "php artisan reverb:start --host=0.0.0.0 --port=6001"
    depends_on:
      - redis

  customer-service:
    build:
      context: ./services/customer-service
    container_name: customer-service
    volumes:
      - ./services/customer-service:/var/www
    ports:
      - "8001:8000"
    networks:
      - default
      - shared-capstone-network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    command: >
      sh -lc "if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && php artisan serve --host=0.0.0.0 --port=8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started

  customer-service-queue:
    build:
      context: ./services/customer-service
    container_name: customer-service-queue
    volumes:
      - ./services/customer-service:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    command: >
      sh -lc "php artisan queue:work redis --sleep=1 --tries=3 --timeout=90"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started
    restart: unless-stopped

  ticket-service:
    build:
      context: ./services/ticket-service
    container_name: ticket-service
    volumes:
      - ./services/ticket-service:/var/www
    ports:
      - "8002:8000"
    command: sh -lc "if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi && if grep -q '^APP_KEY=$' .env; then php artisan key:generate --force; fi && php -d upload_max_filesize=15M -d post_max_size=15M artisan serve --host=0.0.0.0 --port=8000"
    networks:
      - default
      - shared-capstone-network
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started

  ticket-service-queue:
    build:
      context: ./services/ticket-service
    container_name: ticket-service-queue
    volumes:
      - ./services/ticket-service:/var/www
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CACHE_DRIVER: redis
      BROADCAST_DRIVER: reverb
      QUEUE_CONNECTION: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: local
      REVERB_APP_KEY: local
      REVERB_APP_SECRET: local
      REVERB_HOST: reverb
      REVERB_PORT: 6001
    command: >
      sh -lc "php artisan queue:work redis --sleep=1 --tries=3 --timeout=90"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      reverb:
        condition: service_started
    restart: unless-stopped

  notification-service:
    build:
      context: ./services/notification-service
    container_name: notification-service
    volumes:
      - ./services/notification-service:/var/www
    ports:
      - "8003:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  analytics-service:
    build:
      context: ./services/analytics-service
    container_name: analytics-service
    volumes:
      - ./services/analytics-service:/var/www
    ports:
      - "8004:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  ai-service:
    build:
      context: ./services/AI-service
    container_name: ai-service
    volumes:
      - ./services/AI-service:/var/www
    ports:
      - "8005:8000"
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${MYSQL_DATABASE}
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  ticketing-frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: ticketing_web
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    networks:
      - shared-capstone-network
    environment:
      VITE_BASE_PATH: "/ticketing/"
      VITE_PORT: 5005
    command: npm run dev -- --host 0.0.0.0 --port 5005
    restart: always

  customer-ticketing-frontend:
    build:
      context: ./frontend/web
      dockerfile: Dockerfile
    container_name: customer_ticketing_web
    volumes:
      - ./frontend/web:/app
      - /app/node_modules
    ports:
      - "5006:5006"
    environment:
      VITE_BASE_PATH: "/"
      VITE_APP_MODE: "customer"
      VITE_PORT: 5006
    command: npm run dev -- --host 0.0.0.0 --port 5006
    restart: always

volumes:
  db_data:
  redis_data:

networks:
  default:
    driver: bridge
  shared-capstone-network:
    external: true
