server {
    listen ${NGINX_PORT};
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Try to serve the file directly; if not found, check if the URI
    # matches a base-path route and serve its index.html for SPA routing.
    location / {
        try_files $uri $uri/ @fallback;
    }

    # SPA fallback: find the nearest index.html by walking up the path.
    # For /ticketing/dashboard → serves /ticketing/index.html
    # For /some/page → serves /index.html
    location @fallback {
        rewrite ^(/[^/]+)/.+$ $1/index.html last;
        rewrite ^/.+$ /index.html last;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
